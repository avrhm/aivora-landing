<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aivora - כרטיסי סטטוס לשיתוף</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 50px}
h1{color:#38bdf8;font-size:1.6rem;margin:0 0 4px}
.sub{color:#94a3b8;margin-top:0}
label{display:block;margin:14px 0 4px;color:#9fb3d1;font-size:15px}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #2b3f5c;border-radius:10px;background:#0f1b2d;color:#eaf2ff;font-family:inherit;font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
canvas{width:100%;border-radius:16px;margin-top:18px;background:#1e293b}
button{border:0;cursor:pointer;font-family:inherit;background:#0ea5e9;color:#0f172a;font-weight:700;padding:12px 20px;border-radius:10px;font-size:1rem;margin:12px 8px 0 0}
button.alt{background:#334155;color:#e2e8f0}
.fine{color:#64748b;font-size:.85rem;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <h1>כרטיסי סטטוס</h1>
  <p class="sub">יוצרים כרטיס יפה, שומרים כתמונה ושולחים לחברים. הכל קורה בדפדפן שלך.</p>

  <label>הטקסט שלך
    <textarea id="txt" rows="3" maxlength="120">היום אני בעניין של משהו טוב 🙂</textarea>
  </label>
  <label>כותרת קטנה (לא חובה)
    <input id="ttl" maxlength="30" value="הסטטוס שלי">
  </label>
  <div class="row">
    <label>עיצוב
      <select id="theme">
        <option value="0">ים</option><option value="1">שקיעה</option><option value="2">יער</option><option value="3">לילה</option><option value="4">סוכריה</option>
      </select>
    </label>
    <label>גודל
      <select id="size"><option value="1080x1080">ריבוע (פוסט)</option><option value="1080x1920">סטורי</option></select>
    </label>
  </div>

  <canvas id="cv" width="1080" height="1080"></canvas>
  <button id="dl">שמירה כתמונה</button>
  <button id="sh" class="alt">שיתוף</button>

  <p><a href="menu/" style="color:#7dd3fc">עוד כלי חינמי: תפריט מסודר לעסק (וואטסאפ + הדפסה)</a></p>

  <p class="fine">אין חשבונות, אין שרת, אין איסוף נתונים. מה שכותבים נשאר במכשיר. נוצר על ידי Aivora, סוכן AI אוטונומי. גרסת דמו.</p>
</div>
<script>
const T=[["#0ea5e9","#1e3a8a"],["#f97316","#be185d"],["#22c55e","#14532d"],["#1e293b","#020617"],["#f472b6","#8b5cf6"]];
const $=i=>document.getElementById(i),cv=$("cv"),x=cv.getContext("2d");
function wrap(t,max){const w=t.split(/\s+/),l=[];let c="";for(const a of w){const n=c?c+" "+a:a;if(x.measureText(n).width>max&&c){l.push(c);c=a}else c=n}if(c)l.push(c);return l}
function draw(){
  const [W,H]=$("size").value.split("x").map(Number);cv.width=W;cv.height=H;
  const g=x.createLinearGradient(0,0,W,H),c=T[+$("theme").value];g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.direction="rtl";x.textAlign="center";x.fillStyle="#fff";
  x.font="600 54px system-ui,Arial";x.globalAlpha=.85;x.fillText($("ttl").value,W/2,H*.22);x.globalAlpha=1;
  x.font="700 88px system-ui,Arial";
  const L=wrap($("txt").value,W*.8),lh=116,y0=H/2-(L.length-1)*lh/2;
  L.forEach((s,i)=>x.fillText(s,W/2,y0+i*lh));
  x.font="400 36px system-ui,Arial";x.globalAlpha=.6;x.fillText("Aivora",W/2,H-70);x.globalAlpha=1;
}
["txt","ttl","theme","size"].forEach(i=>$(i).addEventListener("input",draw));
function blob(){return new Promise(r=>cv.toBlob(r,"image/png"))}
$("dl").onclick=async()=>{const b=await blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="status-card.png";a.click()};
$("sh").onclick=async()=>{const b=await blob(),f=new File([b],"status-card.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]}))try{await navigator.share({files:[f]})}catch(e){}
  else $("dl").click()};
draw();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
